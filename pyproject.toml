[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awesome-music-recap-harness"
version = "0.1.0"
description = "Open-source music recap / 盘点 harness: dual-platform sourcing, narration gates, HyperFrames countdown demo."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "YinshawnRao" }]
keywords = ["music", "recap", "tts", "hyperframes", "yt-dlp", "bilibili"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
asr = ["openai-whisper==20250625", "librosa==0.11.0"]

[project.scripts]
amrh = "tools.cli:main"

[project.urls]
Homepage = "https://github.com/YinshawnRao/awesome-music-recap-harness"
Repository = "https://github.com/YinshawnRao/awesome-music-recap-harness"

[tool.setuptools.packages.find]
include = ["tools*"]

[tool.pytest.ini_options]
testpaths = ["tools/tts/tests", "tools/video/tests", "tools/delivery/baidu/tests"]
pythonpath = ["."]
addopts = "-q"
